set -g prefix C-a

set -g escape-time 0

unbind C-b

bind-key C-a send-prefix


unbind %
bind _ split-window -v -c "#{pane_current_path}"

unbind '"'
bind - split-window -h -c "#{pane_current_path}"

unbind c
bind-key c new-window -c "#{pane_current_path}"

unbind C-c
bind-key C-c new-session -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# turn mouse on
set -g mouse on

# restore vim sessions
set -g @resurrect-strategy-vim 'session'
# restore neovim sessions
set -g @resurrect-strategy-nvim 'session'
# restore panes
set -g @resurrect-capture-pane-contents 'on'
# restore last saved environment (automatically)
set -g @continuum-restore 'on'

# ── Theme: Tokyo Night Storm (Brighter) ──────────────────
# Palette: bg=#24283b  fg=#c0caf5  accent=#7dcfff  accent2=#bb9af7  dim=#737aa2  black=#1a1b26  green=#9ece6a  orange=#ff9e64

# Terminal colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#24283b,fg=#c0caf5"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name with icon
set -g status-left "#[fg=#1a1b26,bg=#7dcfff,bold]   #S #[fg=#7dcfff,bg=#24283b,nobold] "

# Right: git branch | date | time with icons
set -g status-right "#[fg=#bb9af7] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-') #[fg=#737aa2]│ #[fg=#9ece6a]󰃰 %m/%d #[fg=#737aa2]│ #[fg=#7dcfff,bold] %H:%M "

# Window tabs with icons
set -g window-status-format "#[fg=#737aa2]  #I  #W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold]  #I  #W #[fg=#bb9af7,bg=#24283b,nobold]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#737aa2"
set -g pane-active-border-style "fg=#7dcfff"

# Message / command style
set -g message-style "bg=#24283b,fg=#7dcfff,bold"
set -g message-command-style "bg=#24283b,fg=#bb9af7"

# Mode (copy mode highlight)
set -g mode-style "bg=#7dcfff,fg=#1a1b26"

# For yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run -b '~/.tmux/plugins/tpm/tpm'
